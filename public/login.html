<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veeduría Ciudadana</title>
   <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
</head>
<body class="login-body">
    <header>
        <h1>Acceso Administrativo</h1>
        <p>Veeduría Ciudadana - San Pelayo</p>
    </header>

    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <a href="/" class="back-link">← Volver al Portal Público</a>
        
        <h2 style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
        
        <form id="formLogin">
            <div class="form-group full" style="margin-bottom: 15px;">
                <label for="cedula">Número de Cédula:</label>
                <input type="text" id="cedula" required placeholder="Ingresa tu número de cédula">
            </div>
            
            <div class="form-group full" style="margin-bottom: 20px;">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" style="width: 100%;">Ingresar al Panel</button>
        </form>
        
        <p id="mensajeError" style="color: #e53e3e; text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
