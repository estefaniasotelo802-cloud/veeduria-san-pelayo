<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veeduría Ciudadana</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
</head>
<body class="login-body">
    <header class="login-header">
        <h1>Acceso Administrativo</h1>
        <p>Veeduría Ciudadana - San Pelayo</p>
    </header>

    <main class="login-container">
        <!-- Tarjeta de login con mejor tamaño -->
        <div class="login-card-wrapper">
            <a href="/" class="volver-link">← Volver al Portal Público</a>
            
            <form id="formLogin" class="login-form">
                <h2>Iniciar Sesión</h2>

               <div class="form-group">
                   <label for="usuario">Usuario:</label>
                   <input type="text" id="usuario"  name="usuario"  placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-submit">Ingresar al Panel</button>
                <p id="mensajeError" class="error-msg" style="color: red; margin-top: 10px; text-align: center;"></p>
            </form>
        </div>
    </main>

    
    <script src="/login.js"></script>
</body>
</html>
