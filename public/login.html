<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veeduría Ciudadana</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
</head>
<body class="login-body">
    <header>
        <h1>Acceso Administrativo</h1>
        <p>Veeduría Ciudadana - San Pelayo</p>
    </header>

    <main class="login-container">
        <!-- ¡Asegúrate de que el formulario tenga este ID exacto! -->
        <form id="formLogin" class="login-form">
            <a href="/" class="volver-link">← Volver al Portal Público</a>
            <h2>Iniciar Sesión</h2>

            <div class="form-group">
                <label for="cedula">Número de Cédula:</label>
                <input type="text" id="cedula" name="cedula" placeholder="Ingresa tu número de cédula" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Panel</button>
            <p id="mensajeError" class="error-msg" style="color: red; margin-top: 10px;"></p>
        </form>
    </main>

    <!-- ¡Y asegúrate de que la ruta del script empiece con barra diagonal! -->
    <script src="/login.js"></script>
</body>
</html>
